[pytest]
testpaths = tests
addopts = -ra -p no:cacheprovider
xfail_strict = true
markers =
    smoke: fast, high-risk subset run on every change
    unit: pure-function tests of helpers.py (bottom of the pyramid)
    api: JSON REST API tests through the Flask test client
    web: server-rendered page and form tests through the Flask test client
    ui: end-to-end Selenium browser tests against a live isolated server
